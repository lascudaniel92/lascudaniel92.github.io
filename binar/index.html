<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertor de text în orice bază</title>
<meta name="description" content="Convertește orice text — litere, cuvinte, fraze — în orice bază de la 2 la 36, pe un afișaj cu tuburi Nixie.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Comută între modul întunecat și cel deschis">
  <svg class="track-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
  <svg class="track-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" stroke-linejoin="round"/></svg>
  <span class="knob" aria-hidden="true"></span>
</button>

<main>
  <span class="eyebrow">CONVERTOR NUMERIC</span>
  <h1>Orice text, <em>în orice bază</em>.</h1>
  <p class="subhead">Scrie litere, cuvinte sau o frază — fiecare caracter își arată codul, convertit în baza aleasă.</p>

  <div class="device">
    <div class="device-head">
      <span class="brand">MODEL TXT→N</span>
      <span class="power-dot" aria-hidden="true"></span>
    </div>

    <div class="row">
      <label class="row-label" for="numInput">Intrare <span class="row-hint">(text liber)</span></label>
      <input
        id="numInput"
        class="num-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="scrie orice..."
        aria-describedby="inputError"
      >
      <span id="inputError" class="input-error"></span>
    </div>

    <div class="row row-base">
      <label class="row-label" for="baseRange">Bază țintă</label>
      <div class="base-hero" aria-hidden="true">
        <span class="base-digit" id="baseTubeTens">0</span><span class="base-digit" id="baseTubeOnes">2</span>
      </div>
      <div class="base-slider-wrap">
        <input type="range" id="baseRange" class="base-range" min="2" max="36" step="1" value="2" aria-label="Bază țintă, de la 2 la 36">
        <div class="base-ticks" aria-hidden="true"></div>
      </div>
      <div class="base-scale" aria-hidden="true" id="baseScale">
        <span data-value="2">2</span><span data-value="10">10</span><span data-value="16">16</span><span data-value="26">26</span><span data-value="36">36</span>
      </div>
    </div>

    <div class="row output-row">
      <label class="row-label">Ieșire <span class="row-hint">(codul fiecărui caracter)</span></label>
      <div class="tube-bank" id="tubeBank" aria-live="polite"></div>
    </div>

    <div class="row">
      <label class="row-label" for="copyOutput">Copiază rezultatul</label>
      <div class="copy-row">
        <input id="copyOutput" class="copy-input" type="text" readonly aria-label="Rezultatul, gata de copiat">
        <button class="copy-btn" id="copyBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="copyBtnLabel">Copiază</span>
        </button>
      </div>
    </div>
  </div>

  <footer>Fiecare caracter e convertit după codul lui (A=65, a=97 ...). Cifrele bazelor peste 10 folosesc A–Z.</footer>
</main>

<script src="main.js"></script>
</body>
</html>
